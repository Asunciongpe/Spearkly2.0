const nrm=x=>{x=x.toLowerCase().replace(/[’]/g,"'");for(const[a,b]of EX)x=x.replace(a,b);return x.replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim()};
const rx=p=>new RegExp('^'+p.replace(/\{([^}]*)\}/g,'(?:$1)').replace(/\(([^)?:][^)]*)\)/g,'(?:$1)?')+'$');
const ex=p=>{p=p.replace(/\{([^}|]*)[^}]*\}/g,'$1').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();return p[0].toUpperCase()+p.slice(1)+'.'};
const hs=x=>{let h=2166136261;for(const c of x)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
function dayOrder(n,key){let a=[...Array(n).keys()],h=hs(ago(0)+key);const r=()=>{h=h+1831565813|0;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};for(let i=n-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function ds(){const a=S.days||[];let n=0,i=a.includes(ago(0))?0:1;while(a.includes(ago(i))){n++;i++}return n}
const txp=()=>S.tx&&S.tx.d===ago(0)?S.tx.x:0;
function streakCard(){const a=S.days||[],n=ds(),done=a.includes(ago(0));
 const w=[6,5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-i);const k=dk(d);return `<div class="dy ${a.includes(k)?'on':''} ${i?'':'t'}">${'DLMXJVS'[d.getDay()]}<i>${a.includes(k)?'🔥':''}</i></div>`}).join('');
 const m=n===0?'Practica hoy para empezar tu racha.':done?'¡Meta de hoy cumplida! Vuelve mañana.':`Consigue ${GOAL} XP hoy para mantener tu racha.`;
 return `<div class=sc><b class=n>🔥 ${n}</b> <span class=sub>${n===1?'día':'días'} de racha · mejor: ${Math.max(S.best||0,n)}</span><div class=wk>${w}</div><p class=sub style="margin:10px 0 0">${m}</p></div>`}

function home(){const r=S.req;
 $.innerHTML=`<h1>Speakly</h1><p class=sub>Aprende inglés a tu nivel y sube practicando, sin prisa.</p>${streakCard()}
 ${r?`<button class="btn main" onclick="pend()">Solicitud ${r.l} en revisión</button>`:''}
 ${S.lvl?`<button class="btn main" onclick="nextQ()">Continuar en ${S.lvl}</button>`:''}
 <button class="btn ${S.lvl||r?'':'main'}" onclick="startTest()">Hacer el test de nivel (3 min)</button>
 <h2>¿Tienes un certificado de inglés?</h2><p class=sub>Elige tu nivel y envíalo para que lo revisemos.</p>
 <div class=grid>${L.map(l=>`<button class=lv onclick="ask('${l}')"><b>${l}</b><span>${D[l]}</span></button>`).join('')}</div>
 <p class=sub id=cl style="margin-top:18px">${cloudMsg()}</p>`}
function ask(l){
 $.innerHTML=`<button class=link style="margin:0 0 8px" onclick="home()">← Volver</button><h1>Nivel ${l}</h1>
 <p class=sub>Para empezar directamente en ${l} necesitamos un certificado que lo demuestre (Cambridge, IELTS, TOEFL, DELE, Duolingo English Test…). María lo revisa y te responde en menos de 2 días.</p>
 <label class=sub for=nm>Tu nombre completo</label><input id=nm class=inp autocomplete=name>
 <label class=sub for=em>Tu correo</label><input id=em class=inp type=email autocomplete=email>
 <p class=err id=msg></p>
 <button class="btn main" onclick="send('${l}')">Continuar</button>
 <button class=btn onclick="startTest()">Prefiero hacer el test</button>`}
function send(l){const n=g('nm').value.trim(),e=g('em').value.trim();
 if(!n||!e){g('msg').textContent='Escribe tu nombre y tu correo.';return}
 S.req={n,e,l,d:new Date().toLocaleDateString('es-ES')};save();pend()}
function mail(r){const b=`Hola María,\n\nSolicito empezar en el nivel ${r.l} en Speakly.\nNombre: ${r.n}\nCorreo: ${r.e}\nFecha: ${r.d}\n\nAdjunto mi certificado.\n`;
 return `mailto:${MAIL}?subject=${encodeURIComponent('Certificado nivel '+r.l+' - '+r.n)}&body=${encodeURIComponent(b)}`}
function pend(){const r=S.req;
 $.innerHTML=`<button class=link style="margin:0 0 8px" onclick="home()">← Inicio</button><h1>Solicitud ${r.l}</h1>
 <div class=note><b>Paso 1.</b> Abre el correo, adjunta tu certificado y envíalo hoy.</div>
 <a class="btn main" href="${mail(r)}" target="_blank" rel="noopener">Abrir mi correo con el mensaje listo</a>
 <p class=sub>Si no se abre, escribe a <b>${MAIL}</b> con tu nombre (${r.n}), el nivel ${r.l} y el certificado adjunto.</p>
 <div class=note><b>Paso 2.</b> María lo revisa y te responde en menos de 2 días. Si te aprueba, te enviará un código.</div>
 <input id=cd class=inp placeholder="Código de aprobación" autocapitalize=characters>
 <p class=err id=msg></p>
 <button class="btn main" onclick="unlock()">Desbloquear nivel ${r.l}</button>
 <button class=btn onclick="startTest()">Mientras tanto, hacer el test</button>
 <button class=link style="margin:0" onclick="S.req=null;save();home()">Cancelar solicitud</button>`}
function unlock(){const r=S.req;
 if(g('cd').value.trim().toUpperCase()===code(r.n,r.l)){S.lvl=r.l;S.req=null;banner=`✅ Aprobado. Empiezas en ${r.l}.`;save();nextQ()}
 else g('msg').textContent='Código incorrecto. Revisa la respuesta de María.'}
function maria(){$.innerHTML=`<h1>Panel de María</h1><p class=sub>Para aprobar: escribe el nombre exacto que envió la persona y su nivel.</p>
 <input id=an class=inp placeholder="Nombre completo"><select id=al class=inp>${L.map(l=>`<option>${l}</option>`).join('')}</select>
 <button class="btn main" onclick="g('out').textContent=code(g('an').value,g('al').value)">Generar código</button>
 <div class=res><div class=big style="font-size:2.4rem" id=out>······</div><p class=sub>Envíaselo por correo a la persona.</p></div>`}
function startTest(){test={i:0,ok:{},items:L.flatMap(l=>T[l].map(q=>({l,...shuf(q)})))};rt()}
function rt(){const t=test,x=t.items[t.i],n=t.items.length;
 $.innerHTML=`<div class=bar><i style="width:${t.i/n*100}%"></i></div><p class=sub>Pregunta ${t.i+1} de ${n}</p>
 <h2 class=q>${x.q}</h2>${x.o.map((o,k)=>`<button class=opt onclick="ta(${k})">${o}</button>`).join('')}`}
function ta(k){const t=test,x=t.items[t.i];if(k===x.c)t.ok[x.l]=(t.ok[x.l]||0)+1;t.i++;t.i<t.items.length?rt():res()}
function res(){let n=-1;for(let i=0;i<6;i++){if(test.ok[L[i]]>0)n=i;else break}
 const l=L[Math.max(n,0)],tot=Object.values(test.ok).reduce((a,b)=>a+b,0);
 S.lvl=l;save();banner='';
 $.innerHTML=`<div class=res><p class=sub>Tu nivel es</p><div class=big>${l}</div><b>${D[l]}</b><p class=sub>${tot} de ${test.items.length} respuestas correctas</p></div>
 <button class="btn main" onclick="nextQ()">Empezar a practicar en ${l}</button>
 <button class=btn onclick="home()">Elegir otro nivel</button>`}

function setMode(m){S.mode=m;save();banner='';nextQ()}
function nextQ(){const l=S.lvl,m=S.mode||'mix',t=m==='mix'?Object.keys(BANK)[Math.random()*4|0]:m;
 const bank=BANK[t][l],key=l+t;if(S.sd!==ago(0)){S.seen={};S.sd=ago(0)}let s=S.seen[key]||[];if(s.length>=bank.length)s=[];
 const i=dayOrder(bank.length,key).find(x=>!s.includes(x));s.push(i);S.seen[key]=s;save();
 const it=bank[i];
 cur=t==='write'?{t,q:it[0],a:it[1],done:false}:t==='gram'?{t,...shuf(it),done:false}:{t,x:it[0],...shuf([it[1],it[2],it[3],'']),done:false};
 rp()}
function body(){const t=cur.t,tag=`<p class=sub>${MODES[t][1]} ${MODES[t][0]}</p>`;
 if(t==='read')return tag+`<div class=pass>${cur.x}</div><h2 class=q>${cur.q}</h2>`;
 if(t==='listen')return tag+`<div class=sc style="text-align:center"><button class="btn main" onclick="say(cur.x)">🔊 Reproducir audio</button><button class=btn onclick="say(cur.x,.6)">🐢 Más lento</button></div><h2 class=q>${cur.q}</h2>`;
 if(t==='write')return tag+`<h2 class=q>Traduce al inglés: “${cur.q}”</h2><input id=wa class=inp ${cur.done?'disabled':''} value="${cur.v||''}" autocomplete=off autocapitalize=off><p class=err id=msg></p>${cur.done?'':'<button class="btn main" onclick="pw()">Comprobar</button>'}`;
 return tag+`<h2 class=q>${cur.q}</h2>`}
function pw(){const v=g('wa').value;if(!v.trim()){g('msg').textContent='Escribe tu respuesta.';return}cur.v=v;grade(cur.a.some(p=>rx(p).test(nrm(v))))}
function rp(){
 const h=(S.h[S.lvl]||[]),ac=h.length?Math.round(h.filter(Boolean).length/h.length*100):0;
 $.innerHTML=`<div class=top><span class=chip>${S.lvl}</span><span>⭐ ${S.xp}</span><span>🔥 ${ds()}</span><span>✔ ${S.streak}</span><button class=link onclick="banner='';home()">Menú</button></div>
 <div class=tabs>${['mix',...Object.keys(MODES)].map(m=>`<button class="tab ${(S.mode||'mix')===m?'on':''}" onclick="setMode('${m}')">${m==='mix'?'🔀 Mixto':MODES[m][1]+' '+MODES[m][0]}</button>`).join('')}</div>
 ${banner?`<div class=ban>${banner}</div>`:''}
 <p class=sub>Meta diaria: ${Math.min(txp(),GOAL)}/${GOAL} XP</p><div class=bar><i style="width:${Math.min(txp(),GOAL)/GOAL*100}%"></i></div>
 <p class=sub style="margin-top:12px">Acierto reciente: ${ac}% (últimas ${h.length} de 10)</p><div class=bar><i style="width:${ac}%"></i></div>
 ${body()}
 ${(cur.o||[]).map((o,k)=>`<button class="opt ${cur.done?(k===cur.c?'ok':k===cur.p?'bad':''):''}" ${cur.done?'disabled':''} onclick="pa(${k})">${o}</button>`).join('')}
 ${cur.done?`<div class=fb>${cur.ok?'✅ ¡Correcto! +10 XP':'❌ No era esa.'} ${cur.e||''}${cur.t==='listen'?`<br>📝 ${cur.x}`:''}${cur.t==='write'?`<br>Ejemplo: <b>${ex(cur.a[0])}</b>${cur.a[1]?`<br>Otra forma: <b>${ex(cur.a[1])}</b>`:''}<br><span class=sub>Hay varias formas válidas de decirlo.</span>`:''}</div><button class="btn main" onclick="banner='';nextQ()">Siguiente</button>`:''}`}
function pa(k){cur.p=k;grade(k===cur.c)}
function grade(ok){cur.done=true;cur.ok=ok;const l=S.lvl,i=L.indexOf(l);
 let goalHit=false;
 if(ok){S.xp+=10;S.streak++;const b=txp();S.tx={d:ago(0),x:b+10};if(b<GOAL&&b+10>=GOAL){S.days=(S.days||[]).concat(ago(0));goalHit=true;S.best=Math.max(S.best||0,ds())}}else S.streak=0;
 const h=(S.h[l]||[]).concat(ok).slice(-10);S.h[l]=h;banner='';
 if(h.length>=10){const sc=h.filter(Boolean).length;
  if(sc>=8){S.h[l]=[];if(i<5){S.lvl=L[i+1];banner=`🎉 ¡Subes a ${S.lvl}! Has acertado ${sc} de 10.`}else banner='🏆 ¡Nivel máximo dominado!'}
  else if(sc<=4&&i>0){S.h[l]=[];S.lvl=L[i-1];banner=`Bajamos a ${S.lvl} para reforzar la base. Volverás a subir.`}}
 if(goalHit){const n=ds();banner=(banner?banner+' ':'')+`🔥 ¡Meta diaria cumplida! Racha de ${n} ${n===1?'día':'días'}.`}
 save();rp()}
let DOC=null,CL=0,tm=0;
function push(){if(!DOC)return;clearTimeout(tm);tm=setTimeout(()=>DOC.set({j:JSON.stringify(S),t:Date.now()}).catch(()=>{CL=0;if(g('cl'))g('cl').textContent=cloudMsg()}),700)}
const cloudMsg=()=>CL?'☁️ Tu progreso se guarda en tu cuenta y te sigue a cualquier dispositivo.':'💾 Tu progreso se guarda solo en este dispositivo. Entra con tu cuenta de Claude para guardarlo en la nube.';
async function initCloud(){try{if(!window.claude||!claude.use)return;
 const [db,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!u)return;
 const id=await u.id();if(!id)return;DOC=db.doc('data/users/'+id+'/profile');
 const d=await DOC.get();
 if(d.exists){try{const c=JSON.parse(d.data().j);if((c.t||0)>=(S.t||0)){S=Object.assign({lvl:null,xp:0,streak:0,h:{},seen:{}},c);try{localStorage.setItem('speakly',JSON.stringify(S))}catch(e){}}}catch(e){}}
 CL=1;push();if(g('cl'))home()}catch(e){}}
location.hash==='#maria'?maria():home();
initCloud();
</script>
</body>
</html>
